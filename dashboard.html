<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <title>Dashboard Financeiro</title>
</head>

<body class="page-dashboard">
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Dashboard Financeiro</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Transações</a>
                <a href="#">Relatórios</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>

       
        <main class="main-dashboard">
 <header class="topbar">
            <h1>Bem-vindo 👋</h1>
            <div class="user">Evandro</div>
        </header>
            <section class="cards">
                <div class="card">
                    <h3>Saldo</h3>
                    <p>30.000</p>
                </div>
                <div class="card">
                    <h3>Receitas</h3>
                    <p>30.000</p>
                </div>
                <div class="card">
                    <h3>Despesas</h3>
                    <p>30.000</p>
                </div>
            </section>
            <section class="chart">
    <h2>Fluxo Financeiro</h2>
    <div class="chart-box">
        <!-- futuro gráfico aqui -->
    </div>
</section>

    <section class="transacoes">
    <h2>Últimas transações</h2>

    <div class="transaction">
        <span>Freela</span>
        <span class="income">+R$ 500</span>
    </div>

    <div class="transaction">
        <span>Mercado</span>
        <span class="expense">-R$ 120</span>
    </div>
</section>
            <section class="acoes">
                <button type="button">+ Adicionar Receita</button>
                <button type="button">- Adicionar Despesa</button>
            </section>
        </main>
    </div>
</body>

</html>
