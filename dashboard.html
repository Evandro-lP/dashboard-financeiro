<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <title>Dashboard Financeiro</title>
</head>

<body class="page-dashboard">
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Dashboard Financeiro</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Transações</a>
                <a href="#">Relatórios</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>

       <main class="main-dashboard">
<section class="hero">

    <header class="topbar">
        <h1>Bem-vindo <span class="user">Evandro</span></h1>
    </header>

    <div class="cards">
        <div class="card">
            <h3>Saldo</h3>
            <p id="saldo">30.000</p>
        </div>

        <div class="card">
            <h3>Receitas</h3>
            <p id="receitas">30.000</p>
        </div>

        <div class="card">
            <h3>Despesas</h3>
            <p id="despesas">30.000</p>
        </div>
    </div>

</section>

    <!-- CONTEÚDO PRINCIPAL -->
    <section class="content-grid">

        <div class="chart">
            <h2>Fluxo Financeiro</h2>
            <div class="chart-box"></div>
        </div>

        <div class="transacoes">
            <h2>Últimas transações</h2>

            <div class="transaction-list">
                <div class="transaction">
                <span>Freela</span>
                <span class="income">+R$ 500</span>
            </div>

            <div class="transaction">
                <span>Mercado</span>
                <span class="expense">-R$ 120</span>
            </div>
            </div>
        </div>

    </section>

    <section class="botbar">
        <div class="botbar-btn">
            <button class="btn-receita" type="button"> + Adicionar Receita</button>
            <button class="btn-despesa" type="button"> - Adicionar Despesa</button>
        </div>
        <div class="botbar-metas">
            <div class="meta-card">
                <h2>Meta longo prazo</h2>
                <p>hb20 sedan</p>
            </div>
            <div class="meta-card">
                <h2>Meta curto prazo</h2>
                <p>web can</p>
            </div>
        </div>
    </section>
    </div>
    <div class="modal hidden" id="modal">
    <div class="modal-content">

        <h2 id="modal-title">Adicionar</h2>

        <input type="text" id="input-nome" placeholder="Descrição">
        <input type="number" id="input-valor" placeholder="Valor">

        <div class="modal-actions">
            <button id="btn-salvar">Salvar</button>
            <button id="btn-fechar">Cancelar</button>
        </div>

    </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
