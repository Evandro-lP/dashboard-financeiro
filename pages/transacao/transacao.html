<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="transacao.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <title>Dashboard Financeiro - Transações</title>
</head>

<body class="page-metas">
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Dashboard Financeiro</h2>
            <nav>
                <a href="../dashboard/dashboard.html">Dashboard</a>
                <a href="./metas.html">Transações</a>
                <a href="#">Metas</a>
                <a href="#">Relatórios</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>

        <main class="transacoes-container">

            <section class="transacoes-header">
                <h1>Transações</h1>
                <p>Gerencie todas as suas receitas e despesas.</p>
            </section>

            <section class="transacoes-toolbar">

                <div class="pesquisa">
                    <input type="text" placeholder="🔍 Pesquisar transação...">
                </div>

                <div class="acoes-toolbar">

                    <div class="filtros">
                        <button id="btnTodas" class="filtro-ativo">Todas</button>
                        <button id="btnReceitas">Receitas</button>
                        <button id="btnDespesas">Despesas</button>
                    </div>

                    <button class="btn-nova-transacao">
                        + Nova Transação
                    </button>

                </div>

            </section>

            <section class="lista-transacoes">

                <!-- As transações serão renderizadas aqui -->

            </section>
            <div class="modal hidden" id="modal">
        <div class="modal-content">

            <h2 id="modal-title">Adicionar</h2>

            <div class="tipo-transacao">
                <button type="button" id="btn-modal-receita">
                    Receita
                </button>
            
                <button type="button" id="btn-modal-despesa">
                    Despesa
                </button>
            </div>
            <div id="form-error" class="form-error hidden"></div>

            <input type="text" id="input-nome" placeholder="Descrição">

            <input type="number" id="input-valor" placeholder="Valor">

            <select id="input-categoria">
                <option value="">Selecione uma categoria</option>
                <option value="delivery">Delivery</option>
                <option value="transporte">Transporte</option>
                <option value="salario">Salário</option>
                <option value="mercado">Mercado</option>
                <option value="outros">Outros</option>
            </select>

            <div class="modal-actions">
                <button id="btn-salvar">Salvar</button>
                <button id="btn-fechar">Cancelar</button>
            </div>

        </div>
    </div>
    <!-- modal de confirmação de excluir transação -->
    <div class="modal hidden" id="delete-modal">
        <div class="modal-content">

            <h2>Excluir transação</h2>
            <p>Tem certeza que deseja excluir esta transação?</p>
            <div class="modal-actions">
                <button id="btn-cancelar-delete">Cancelar</button>
                <button id="btn-confirmar-delete">Excluir</button>
            </div>

        </div>
    </div>

        </main>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="transacao.js"></script>
</body>

</html>
